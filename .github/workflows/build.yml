name: Build packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Drop TUI (ncurses) and zstd to keep the dependency set small and static-friendly.
  EXTRA_CONFIGURE: "--disable-tui --without-zstd"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            branch: linux_x64
            system: linux_x86_64
          - os: macos-14
            branch: darwin_arm64
            system: darwin_arm64
          # Windows is published from a manually-built branch for now (the MSYS2
          # mingw gdb build needs more work); Linux/macOS are built here.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ---------------- Linux: static gmp/mpfr/expat; system libstdc++/glibc (always present) ----------------
      # NB: do NOT delete the system .so's like the macOS recipe does — on Linux
      # libgmp is a transitive dependency of apt/curl/gcc, so removing it breaks
      # the whole runner. Instead put ONLY the .a archives in a private dir and
      # search it first via -L, so ld links gmp/mpfr/expat statically while the
      # system copies stay intact.
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libexpat1-dev zlib1g-dev
          mkdir -p "$PWD/staticlibs"
          cp /usr/lib/x86_64-linux-gnu/libgmp.a \
             /usr/lib/x86_64-linux-gnu/libmpfr.a \
             /usr/lib/x86_64-linux-gnu/libexpat.a "$PWD/staticlibs/"
          export LDFLAGS="-L$PWD/staticlibs"
          bash build.sh
          B=gdb-16.3/build/gdb
          GDBBIN="$B/gdb"; [ -x "$B/.libs/gdb" ] && GDBBIN="$B/.libs/gdb"
          mkdir -p pkg/bin && cp "$GDBBIN" pkg/bin/i8085-elf-gdb
          strip pkg/bin/i8085-elf-gdb   # drop debug symbols (unstripped is >100MB)
          echo "--- size / linkage (only glibc/system expected) ---"; ls -l pkg/bin/i8085-elf-gdb; file pkg/bin/i8085-elf-gdb; ldd pkg/bin/i8085-elf-gdb || true

      # ---------------- macOS: static gmp/mpfr/expat, system libs otherwise ----------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp mpfr expat
          # remove the shared libs so the linker statically links the .a archives
          for p in gmp mpfr expat; do rm -f "$(brew --prefix $p)"/lib/*.dylib; done
          export CPPFLAGS="-I$(brew --prefix gmp)/include -I$(brew --prefix mpfr)/include -I$(brew --prefix expat)/include"
          export LDFLAGS="-L$(brew --prefix gmp)/lib -L$(brew --prefix mpfr)/lib -L$(brew --prefix expat)/lib"
          bash build.sh
          B=gdb-16.3/build/gdb
          GDBBIN="$B/gdb"; [ -x "$B/.libs/gdb" ] && GDBBIN="$B/.libs/gdb"
          mkdir -p pkg/bin && cp "$GDBBIN" pkg/bin/i8085-elf-gdb
          strip pkg/bin/i8085-elf-gdb   # drop debug symbols (unstripped is >100MB)
          echo "--- size / linkage (only system libs expected) ---"; ls -l pkg/bin/i8085-elf-gdb; otool -L pkg/bin/i8085-elf-gdb

      # ---------------- Windows: fully static (MSYS2 MinGW) ----------------
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-expat mingw-w64-x86_64-zlib make tar patch curl coreutils
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # Static C++/gcc runtime; bundle the few remaining mingw DLLs below so
          # the package is self-contained (full -static on mingw is unreliable here).
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          bash build.sh
          B=gdb-16.3/build/gdb
          mkdir -p pkg/bin && cp "$B/.libs/gdb.exe" pkg/bin/i8085-elf-gdb.exe
          strip pkg/bin/i8085-elf-gdb.exe   # drop debug symbols (unstripped is >100MB)
          # bundle any remaining mingw runtime DLLs the binary needs
          ldd pkg/bin/i8085-elf-gdb.exe | awk '/mingw64/{print $3}' \
            | while read -r dll; do cp -n "$dll" pkg/bin/ || true; done
          echo "--- bundled DLLs ---"; ls pkg/bin

      # ---------------- manifest + smoke test + publish ----------------
      - name: Manifest + smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("package.json"))
          m["system"] = ["${{ matrix.system }}"]
          json.dump(m, open("pkg/package.json", "w"), indent=2)
          PY
          if [ "${{ runner.os }}" = "Windows" ]; then GDB=pkg/bin/i8085-elf-gdb.exe; else GDB=pkg/bin/i8085-elf-gdb; fi
          "$GDB" -nx -q -batch -ex "set architecture i8085" > ver.txt 2>&1 || true
          cat ver.txt
          grep -q 'set to "i8085"' ver.txt && echo "i8085 arch OK" || { echo "ERROR: i8085 not recognized"; exit 1; }
      - name: Publish ${{ matrix.branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd pkg
          echo "=== pkg file sizes ==="
          ls -lR .
          git init -q
          git checkout -b "${{ matrix.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ matrix.branch }} from ${GITHUB_SHA::7}"
          echo "=== pushing ==="
          if ! git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${{ matrix.branch }}" 2>push.err; then
            echo "::group::push stderr"
            cat push.err
            echo "::endgroup::"
            # surface the git error via annotations (full logs are 403 for non-admins)
            while IFS= read -r line; do echo "::error::pushfail: $line"; done < push.err
            exit 1
          fi
          echo "push OK"
