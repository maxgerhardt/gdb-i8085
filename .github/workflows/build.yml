name: Build packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Drop TUI (ncurses) and zstd to keep the dependency set small and static-friendly.
  EXTRA_CONFIGURE: "--disable-tui --without-zstd"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            branch: linux_x64
            system: linux_x86_64
          - os: macos-14
            branch: darwin_arm64
            system: darwin_arm64
          - os: windows-latest
            branch: windows_x64
            system: windows_amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ---------------- Linux: fully static ----------------
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          LDFLAGS: -static
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libexpat1-dev zlib1g-dev
          bash build.sh
          B=gdb-16.3/build/gdb
          GDBBIN="$B/gdb"; [ -x "$B/.libs/gdb" ] && GDBBIN="$B/.libs/gdb"
          mkdir -p pkg/bin && cp "$GDBBIN" pkg/bin/i8085-elf-gdb
          echo "--- not-a-dynamic-exec check ---"; file pkg/bin/i8085-elf-gdb; ldd pkg/bin/i8085-elf-gdb || true

      # ---------------- macOS: static gmp/mpfr/expat, system libs otherwise ----------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp mpfr expat
          # remove the shared libs so the linker statically links the .a archives
          for p in gmp mpfr expat; do rm -f "$(brew --prefix $p)"/lib/*.dylib; done
          export CPPFLAGS="-I$(brew --prefix gmp)/include -I$(brew --prefix mpfr)/include -I$(brew --prefix expat)/include"
          export LDFLAGS="-L$(brew --prefix gmp)/lib -L$(brew --prefix mpfr)/lib -L$(brew --prefix expat)/lib"
          bash build.sh
          B=gdb-16.3/build/gdb
          GDBBIN="$B/gdb"; [ -x "$B/.libs/gdb" ] && GDBBIN="$B/.libs/gdb"
          mkdir -p pkg/bin && cp "$GDBBIN" pkg/bin/i8085-elf-gdb
          echo "--- linkage (only system libs expected) ---"; otool -L pkg/bin/i8085-elf-gdb

      # ---------------- Windows: fully static (MSYS2 MinGW) ----------------
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-expat mingw-w64-x86_64-zlib make tar patch curl coreutils
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          LDFLAGS: -static
        run: |
          bash build.sh
          B=gdb-16.3/build/gdb
          mkdir -p pkg/bin && cp "$B/.libs/gdb.exe" pkg/bin/i8085-elf-gdb.exe
          echo "--- DLL deps (want none from mingw) ---"; ldd pkg/bin/i8085-elf-gdb.exe | grep -i mingw || echo "no mingw DLL deps (static OK)"

      # ---------------- manifest + smoke test + publish ----------------
      - name: Manifest + smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("package.json"))
          m["system"] = ["${{ matrix.system }}"]
          json.dump(m, open("pkg/package.json", "w"), indent=2)
          PY
          if [ "${{ runner.os }}" = "Windows" ]; then GDB=pkg/bin/i8085-elf-gdb.exe; else GDB=pkg/bin/i8085-elf-gdb; fi
          "$GDB" -nx -q -batch -ex "set architecture i8085" > ver.txt 2>&1 || true
          cat ver.txt
          grep -q 'set to "i8085"' ver.txt && echo "i8085 arch OK" || { echo "ERROR: i8085 not recognized"; exit 1; }
      - name: Publish ${{ matrix.branch }}
        shell: bash
        run: |
          cd pkg
          git init -q
          git checkout -b "${{ matrix.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ matrix.branch }} from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "${{ matrix.branch }}"
